[worldserver]
# Classic Battlemon remains available; the addon chooses a presentation before fighting.
BattlemonBattles.Enable = 1
BattlemonBattles.AllowClassic = 1
BattlemonBattles.DefaultMode = "pet"
BattlemonBattles.EnableDuels = 1
BattlemonBattles.EnableBotDuels = 1
# Generate a fresh temporary team for every bot duel, ignoring the bot collection.
# Your WoW level: 1-19 = 1-3 basic, 20-59 = 3-6 regular, 60+ adds 25% rare rolls.
# Pokemon levels follow your conscious party average (tiny levels exact; otherwise +/-1 to 3).
# Nothing is inserted into the bot collection; friendly duels have no rewards.
BattlemonBattles.GenerateBotTeams = 1
BattlemonBattles.TeamSize = 6
BattlemonBattles.TurnSeconds = 45
BattlemonBattles.InviteSeconds = 30
# Leaving this radius from the battle start ends the battle; also limits duel separation.
BattlemonBattles.MaxDistance = 25.0
BattlemonBattles.BotThinkMilliseconds = 1500
# Uses the shared overworld template and full 3D display catalog, including Extras.
BattlemonBattles.WorldActors = 1
BattlemonBattles.ActorEntry = 60000

# Native WoW missiles, impacts and sounds; visual packets only, never WoW spell damage.
# 0 restores the previous Pixelmon sprite adaptation. Existing configs default to 1.
BattlemonBattles.NativeSpellVisuals = 1
